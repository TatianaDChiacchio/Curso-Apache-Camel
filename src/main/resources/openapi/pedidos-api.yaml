openapi: 3.0.3

info:
  title: API de Pedidos
  description: API de pedidos utilizando Apache Camel e PostgreSQL
  version: 1.0.0

servers:
  - url: http://localhost:8080

paths:

  /api/pedidos:

    get:
      operationId: listarPedidos
      summary: Lista todos os pedidos
      responses:
        '200':
          description: Lista de pedidos retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pedido'

    post:
      operationId: criarPedido
      summary: Cria um novo pedido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovoPedido'

      responses:
        '201':
          description: Pedido criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'

  /api/pedidos/{id}:

    get:
      operationId: buscarPedido
      summary: Busca um pedido pelo ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Pedido encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'

        '404':
          description: Pedido não encontrado

    delete:
      operationId: excluirPedido
      summary: Exclui um pedido pelo ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64

      responses:
        '204':
          description: Pedido excluído com sucesso

components:

  schemas:

    NovoPedido:
      type: object
      required:
        - produto
        - quantidade
        - valor

      properties:
        produto:
          type: string
          example: Notebook

        quantidade:
          type: integer
          format: int32
          example: 2

        valor:
          type: number
          format: double
          example: 4500.00

    Pedido:
      type: object
      required:
        - id
        - produto
        - quantidade
        - valor

      properties:
        id:
          type: integer
          format: int64
          example: 1

        produto:
          type: string
          example: Notebook

        quantidade:
          type: integer
          format: int32
          example: 2

        valor:
          type: number
          format: double
          example: 4500.00